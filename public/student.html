<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#12343B">
<title>Check in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --hero:#12343B;--hero-ink:#12343B;
  --ink:#12343B;--ink2:#4B6A70;
  --sheet:#fff;--field:#fff;--line:#D3DEDC;--page:#DDE7E5;
  --amber:#E8A317;--ok:#1C7C54;--okbg:#E1F2E9;--bad:#B3402F;--warn:#8A5A00;
  --display:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--hero:#0E2A30;--ink:#E8F1F0;--ink2:#9DB7BB;--sheet:#102329;--field:#173039;--line:#2B444B;--page:#081619;--okbg:#14392B}
}
*{box-sizing:border-box}
html{background:var(--hero)}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--hero);color:var(--ink);font:17px/1.5 'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
.shell{min-height:100vh;min-height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--sheet)}
@media (min-width:560px){
  body{background:var(--page)}
  html{background:var(--page)}
  .shell{box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.18)}
}
#app{flex:1;display:flex;flex-direction:column}

/* ---------- hero (top, coloured) ---------- */
.hero{position:relative;overflow:hidden;flex:1;display:flex;flex-direction:column;background:var(--hero);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 24px 56px;text-align:center}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.06;pointer-events:none}
.hero::before{width:320px;height:320px;left:-120px;top:-90px}
.hero::after{width:240px;height:240px;right:-90px;bottom:10px}
.hero.ok{background:var(--ok)}
.hero.bad{background:var(--bad)}
.hero.warn{background:var(--amber);color:var(--hero-ink)}
.hero.warn::before,.hero.warn::after{background:#fff;opacity:.25}
.brand{position:relative;align-self:flex-start;display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.brand .mark{width:32px;height:32px;border-radius:10px;background:var(--amber);display:grid;place-items:center}
.hero-body{position:relative;margin:auto 0;padding:12px 0;display:grid;justify-items:center;gap:6px}
.hero h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:10px 0 4px;text-wrap:balance;max-width:16em}
.hero p{margin:0;font-size:17px;opacity:.88;max-width:22em;text-wrap:balance}
.art{width:min(250px,64vw);height:auto;display:block;overflow:visible}
.icon{width:96px;height:96px;display:block;overflow:visible}
.icon .ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.3s ease-out 1}
.icon .tick{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{from{transform:scale(.7);opacity:.6}to{transform:scale(1.18);opacity:0}}
.scan{animation:scan 2.6s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(46px)}}
.spin{width:60px;height:60px;border:6px solid rgba(255,255,255,.25);border-top-color:var(--amber);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  .scan,.spin,.icon .ring{animation:none}
  .icon .tick{animation:none;stroke-dashoffset:0}
}

/* ---------- sheet (bottom, content) ---------- */
.sheet{position:relative;margin-top:-30px;background:var(--sheet);border-radius:30px 30px 0 0;padding:28px 24px 12px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 4px}
.sheet p{margin:0 0 12px}
.muted{color:var(--ink2)}
.stack{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:700;font-size:16px}
input{font:inherit;font-weight:400;padding:12px 14px;border:2px solid var(--line);border-radius:14px;min-height:54px;width:100%;color:var(--ink);background:var(--field)}
input:focus{border-color:var(--amber)}
input:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.code{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:.3em;text-indent:.3em;text-align:center;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:700;padding:12px 18px;border-radius:14px;border:2px solid var(--amber);background:var(--amber);color:#12343B;cursor:pointer;min-height:54px;width:100%}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.note{font-size:15px;color:var(--ink2);text-align:center;margin:14px 0 0}

/* ticket shown after a successful check-in */
.ticket{border:2px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:22px}
.ticket .top{padding:16px 18px;background:var(--okbg)}
.ticket .top b{display:block;font-family:var(--display);font-size:22px;line-height:1.2}
.ticket .top span{color:var(--ink2);font-size:15px}
.ticket .bot{padding:14px 18px;border-top:2px dashed var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ticket .bot span{color:var(--ink2);font-size:15px}
.ticket .bot b{font-family:var(--display);font-size:24px}

/* history */
.hist{margin-top:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.hrow small{display:block;color:var(--ink2);font-size:14px}
.hrow>span:last-child{white-space:nowrap;color:var(--ink2);font-size:14px;text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--okbg);color:var(--ok);margin-right:6px;vertical-align:1px}
@media (prefers-color-scheme:dark){.pill{color:#7FD6A8}}
.empty{display:flex;gap:12px;align-items:center;padding:14px;border:2px dashed var(--line);border-radius:14px;color:var(--ink2);font-size:16px}

#foot{background:var(--sheet);text-align:center;padding:0 16px calc(14px + env(safe-area-inset-bottom))}
.link{font:inherit;font-size:14px;background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--bad);color:#fff;padding:12px 18px;border-radius:14px;max-width:90vw;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.good{background:var(--ok)}
</style>
</head>
<body>
<div class="shell">
  <main id="app"></main>
  <footer id="foot"></footer>
</div>
<div id="toast" hidden role="status" aria-live="polite"></div>

<script>
const SUPABASE_URL = 'https://ghbjubthwxrvifnpmdit.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoYmp1YnRod3hydmlmbnBtZGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTI2ODMsImV4cCI6MjEwNzA2ODY4M30.kwl_bi14TjPqgH1MsRE3JzH_Ws7ubPGbgIjeKjZFppg';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
let token = new URLSearchParams(location.search).get('t');   // from the scanned QR
let uid = null, running = false, again = false;

function toast(msg, good) {
  const t = $('#toast'); t.textContent = msg; t.className = good ? 'good' : ''; t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 6000);
}

/* ---------- artwork ---------- */
// A phone scanning a QR code. The amber line is the only looping motion on the page.
const ART_PHONE = `<svg class="art" viewBox="0 0 220 190" aria-hidden="true">
  <circle cx="34" cy="40" r="7" fill="#E8A317"/><circle cx="196" cy="70" r="5" fill="#E8A317" opacity=".7"/>
  <circle cx="186" cy="20" r="3.5" fill="#fff" opacity=".6"/><circle cx="22" cy="118" r="4" fill="#fff" opacity=".5"/>
  <rect x="64" y="8" width="92" height="156" rx="20" fill="#EDF2F1"/>
  <rect x="72" y="22" width="76" height="128" rx="12" fill="#0B2328"/>
  <g fill="none" stroke="#fff" stroke-width="3">
    <rect x="82" y="32" width="18" height="18" rx="3"/><rect x="120" y="32" width="18" height="18" rx="3"/><rect x="82" y="70" width="18" height="18" rx="3"/>
  </g>
  <g fill="#fff"><rect x="87" y="37" width="8" height="8" rx="1.5"/><rect x="125" y="37" width="8" height="8" rx="1.5"/><rect x="87" y="75" width="8" height="8" rx="1.5"/>
    <rect x="108" y="34" width="6" height="6"/><rect x="108" y="46" width="6" height="6"/><rect x="114" y="58" width="6" height="6"/>
    <rect x="126" y="62" width="6" height="6"/><rect x="108" y="72" width="6" height="6"/><rect x="120" y="78" width="6" height="6"/>
    <rect x="132" y="76" width="6" height="6"/><rect x="104" y="84" width="6" height="6"/></g>
  <rect class="scan" x="78" y="38" width="64" height="4" rx="2" fill="#E8A317"/>
  <rect x="88" y="104" width="44" height="12" rx="6" fill="#E8A317"/>
  <rect x="94" y="124" width="32" height="5" rx="2.5" fill="#fff" opacity=".35"/>
  <circle cx="150" cy="138" r="24" fill="#1C7C54" stroke="#12343B" stroke-width="5"/>
  <path d="M139 138l8 8 15-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
const ART_MAIL = `<svg class="art" viewBox="0 0 220 160" aria-hidden="true" style="width:min(210px,56vw)">
  <circle cx="30" cy="30" r="6" fill="#E8A317"/><circle cx="192" cy="46" r="4.5" fill="#fff" opacity=".6"/><circle cx="26" cy="120" r="4" fill="#fff" opacity=".5"/>
  <rect x="36" y="38" width="148" height="100" rx="14" fill="#EDF2F1"/>
  <path d="M42 50l68 52 68-52" fill="none" stroke="#12343B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="64" y="14" width="92" height="52" rx="12" fill="#E8A317"/>
  <g fill="#12343B"><circle cx="90" cy="40" r="6"/><circle cx="110" cy="40" r="6"/><circle cx="130" cy="40" r="6"/></g>
</svg>`;
function icon(kind) {
  const glyph = {
    ok: '<path class="tick" pathLength="1" d="M31 50l13 13 24-27" fill="none" stroke="#1C7C54" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>',
    bad: '<path d="M35 35l26 26M61 35L35 61" fill="none" stroke="#B3402F" stroke-width="8" stroke-linecap="round"/>',
    warn: '<path d="M48 30v23" stroke="#12343B" stroke-width="8" stroke-linecap="round"/><circle cx="48" cy="66" r="5" fill="#12343B"/>'
  }[kind];
  const label = { ok: 'Success', bad: 'Problem', warn: 'Notice' }[kind];
  return `<svg class="icon" viewBox="0 0 96 96" role="img" aria-label="${label}"><circle class="ring" cx="48" cy="48" r="44" fill="#fff" opacity=".3"/><circle cx="48" cy="48" r="38" fill="#fff"/>${glyph}</svg>`;
}

/* ---------- layout helper: coloured top, content sheet at the bottom ---------- */
// To add the university logo later, replace the <span class="mark"> element below with an <img>.
const BRAND = `<div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12343B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l5 5L19 7"/></svg></span>Attendance</div>`;
function screen({ tone = '', art = '', title, sub = '', body = '' }) {
  app.innerHTML = `<div class="hero ${tone}">${BRAND}<div class="hero-body">${art}<h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div></div><div class="sheet">${body}</div>`;
}

/* ---------- flow ---------- */
async function step() {
  const { data: { session } } = await sb.auth.getSession();
  uid = session?.user?.id || null;
  $('#foot').innerHTML = session ? '<button id="out" class="link" type="button">Not you? Sign out</button>' : '';
  if (session) $('#out').onclick = () => { if (confirm('Sign out? You will need a new email code to sign in again.')) sb.auth.signOut(); };
  if (!session) return viewLogin();
  if (token) {
    const t = token; token = null;
    history.replaceState(null, '', location.pathname);   // a reload must not re-submit the code
    return checkIn(t, session);
  }
  return viewReady(session);
}
async function run() {
  if (running) { again = true; return; }
  running = true;
  do { again = false; await step(); } while (again);
  running = false;
}
sb.auth.onAuthStateChange((ev, s) => { if ((s?.user?.id || null) !== uid) run(); });
run();

/* ---------- screens ---------- */
function viewLogin() {
  screen({
    art: ART_PHONE,
    title: 'Mark your attendance in one scan',
    sub: token ? 'Sign in once, then scan the code on the screen again to check in.' : 'Sign in once with the university email your lecturer has on the class list. After that, you only scan.',
    body: `<form id="f1" class="stack"><label>University email<input id="em" type="email" required autocomplete="email" inputmode="email" placeholder="name@university.dz"></label>
      <button class="btn">Send code</button></form>
      <p class="note">No password. We email you a code, and you only need it the first time.</p>`
  });
  $('#f1').onsubmit = async e => {
    e.preventDefault();
    const email = $('#em').value.trim().toLowerCase(), b = $('#f1 button');
    b.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email });
    b.disabled = false;
    if (error) return toast('Could not send the code: ' + error.message);
    askCode(email);
  };
}
function askCode(email) {
  screen({
    art: ART_MAIL,
    title: 'Check your email',
    sub: `We sent a code to <b>${esc(email)}</b>.`,
    body: `<form id="f2" class="stack"><label>Code<input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" required></label>
      <button class="btn" id="go">Sign in</button>
      <button type="button" id="again" class="btn ghost" disabled>Send a new code</button>
      <button type="button" id="back" class="link">Use a different email</button></form>
      <p class="note">It can take a minute to arrive. Check your spam folder if you don’t see it.</p>`
  });
  $('#back').onclick = viewLogin;
  // "Send a new code" unlocks after 30 seconds so students don't trigger the email limit by tapping repeatedly
  const again = $('#again');
  let left = 30;
  const tick = () => { again.textContent = left > 0 ? `Send a new code (${left}s)` : 'Send a new code'; again.disabled = left > 0; };
  tick();
  const timer = setInterval(() => { if (!again.isConnected) return clearInterval(timer); left--; tick(); if (left <= 0) clearInterval(timer); }, 1000);
  again.onclick = async () => {
    again.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email });
    if (error) { toast('Could not send the code: ' + error.message); again.disabled = false; return; }
    toast('New code sent. Use the latest one.', true);
    left = 30; tick();
    clearInterval(timer);
    const t2 = setInterval(() => { if (!again.isConnected) return clearInterval(t2); left--; tick(); if (left <= 0) clearInterval(t2); }, 1000);
  };
  $('#f2').onsubmit = async e => {
    e.preventDefault();
    const b = $('#go'); b.disabled = true;
    const { error } = await sb.auth.verifyOtp({ email, token: $('#cd').value.trim(), type: 'email' });
    if (error) { b.disabled = false; toast('That code did not work. Check it, or request a new one.'); }
  };
}
const KIND = { lecture: 'Lecture', td: 'TD', tp: 'TP' };
const fmtWhen = x => new Date(x).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fullName = r => [r.surname, r.first_name, r.second_name].filter(Boolean).join(' ');
async function loadHistory() {
  const { data, error } = await sb.rpc('my_checkins', { p_limit: 10 });
  return error ? null : (data || []);
}
function historyHtml(rows) {
  if (rows === null) return '';
  const who = rows.find(r => r.surname);
  return `<div class="hist"><h2>Your recent check-ins</h2>
    ${who ? `<p class="muted">Your lecturer sees you as <b>${esc(fullName(who))}</b>.</p>` : ''}
    ${rows.length ? rows.map(r => `<div class="hrow"><span><b>${esc(r.course_name)}</b><small><span class="pill">${esc(KIND[r.kind] || r.kind)}</span>${esc(r.session_title || '')}${r.session_title && r.group_name ? ', ' : ''}${r.group_name ? 'Group ' + esc(r.group_name) : ''}${r.method === 'manual' ? ', marked by lecturer' : ''}</small></span><span>${fmtWhen(r.checked_at)}</span></div>`).join('') : '<div class="empty"><span>Nothing here yet. Your first scan will show up in this list.</span></div>'}
  </div>`;
}
async function viewReady(session) {
  screen({
    art: ART_PHONE,
    title: 'You’re signed in',
    sub: esc(session.user.email),
    body: `<p>To check in, scan the QR code on your lecturer’s screen with your phone’s camera. You won’t need to sign in again on this phone.</p>
      <div id="hist"></div>
      <button class="btn ghost" id="rf" style="margin-top:12px">Refresh my check-ins</button>`
  });
  const show = async () => { $('#hist').innerHTML = historyHtml(await loadHistory()); };
  $('#rf').onclick = show;
  show();
}
function viewResult(kind, title, detail, sheetHtml = '', after = '') {
  screen({
    tone: kind,
    art: icon(kind),
    title,
    sub: detail,
    body: `${sheetHtml}${after}`
  });
}

async function checkIn(t, session) {
  screen({ art: '<div class="spin" role="img" aria-label="Loading"></div>', title: 'Checking you in…', body: '<p class="muted">This takes a second. Keep this page open.</p>' });
  const { data, error } = await sb.rpc('check_in', { p_token: t });
  if (error) {
    viewResult('warn', 'Could not check in', 'There was a connection problem.', '<p>Check your internet connection and try again.</p><button class="btn" id="retry">Try again</button>');
    $('#retry').onclick = () => checkIn(t, session);
    return;
  }
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (data === 'ok') {
    const rows = await loadHistory();
    const last = rows && rows[0];
    const name = last && last.surname ? fullName(last) : session.user.email;
    const at = last ? new Date(last.checked_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : time;
    const ticket = `<div class="ticket"><div class="top">${last ? `<b>${esc(last.course_name)}</b><span>${esc(last.session_title || KIND[last.kind] || '')}</span>` : '<b>Check-in saved</b>'}</div>
      <div class="bot"><span>Recorded at</span><b>${esc(at)}</b></div></div>`;
    return viewResult('ok', 'Attendance recorded', esc(name), ticket, historyHtml(rows));
  }
  if (data === 'wrong_group') return viewResult('bad', 'Wrong group', 'This session is for a different section or group.', '<p>Check that you scanned the right screen, then scan again.</p>');
  if (data === 'not_enrolled') return viewResult('bad', 'You’re not on this class list', 'Your email isn’t on the list for this course.', `<p>You signed in as <b>${esc(session.user.email)}</b>. Tell your lecturer, who can mark you present.</p>`);
  return viewResult('warn', 'Code expired', 'The code on the screen changes every 15 seconds.', '<p>Scan the current code on the screen again.</p>');
}
</script>
</body>
</html>
