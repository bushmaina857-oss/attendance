<script>
/* ---------- config ---------- */
const SUPABASE_URL = 'https://ghbjubthwxrvifnpmdit.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoYmp1YnRod3hydmlmbnBtZGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0OTI2ODMsImV4cCI6MjEwNzA2ODY4M30.kwl_bi14TjPqgH1MsRE3JzH_Ws7ubPGbgIjeKjZFppg';
let rotateMs = (() => { try { const v = +localStorage.getItem('rotateMs'); return [15000, 30000, 60000, 120000, 300000].includes(v) ? v : 30000; } catch (_) { return 30000; } })();
const lbl = ms => ms < 60000 ? ms / 1000 + ' seconds' : ms / 60000 + (ms === 60000 ? ' minute' : ' minutes');
const POLL_MS = 4000;         // refresh the attendance list every 4 seconds
const STUDENT_PAGE = 'student.html'; // must sit in the same folder as this file

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');
const KIND = { lecture: 'Lecture', td: 'TD', tp: 'TP' };
const fmtDate = x => { const d = new Date(x); return d.toLocaleString([], { day: 'numeric', month: 'short', ...(d.getFullYear() === new Date().getFullYear() ? {} : { year: 'numeric' }), hour: '2-digit', minute: '2-digit' }); };
const fmtTime = x => new Date(x).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const LOADING = '<div class="wrap gap"><p class="muted">Loading…</p></div>';
const initials = r => (((r.surname || '')[0] || '') + ((r.first_name || '')[0] || '')).toUpperCase();

let timers = [], raf = 0, routeId = 0, uid = null, wake = null;
const every = (fn, ms) => { const t = setInterval(fn, ms); timers.push(t); return t; };
function stopAll() {
  timers.forEach(clearInterval); timers = [];
  cancelAnimationFrame(raf);
  if (wake) { wake.release().catch(() => {}); wake = null; }
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, bad ? 6000 : 3500);
}
const sessionMeta = s => [KIND[s.kind], s.section && 'Section ' + s.section, s.group_name && 'Group ' + s.group_name, fmtDate(s.started_at)].filter(Boolean).join(' · ');

/* coloured page banner; sub and extra are trusted HTML, everything user-made is escaped by the caller */
function banner(title, sub = '', { back, slim, extra = '' } = {}) {
  return `<div class="banner${slim ? ' slim' : ''}"><div class="wrap">${back ? `<a class="back" href="${back.href}">${esc(back.text)}</a>` : ''}
    <h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}${extra}</div></div>`;
}

/* ---------- routing ---------- */
async function route() {
  stopAll();
  const my = ++routeId;
  const { data: { session } } = await sb.auth.getSession();
  if (my !== routeId) return;
  uid = session?.user?.id || null;
  $('#who').innerHTML = session ? `<span>${esc(session.user.email)}</span><button id="out">Sign out</button>` : '';
  if (session) $('#out').onclick = () => sb.auth.signOut();
  if (!session) return viewLogin();
  const [, page, id] = location.hash.slice(1).split('/');
  if (page === 'course') return viewCourse(id, my);
  if (page === 'session') return viewSession(id, my);
  return viewHome(my);
}
let rt; const go = () => { clearTimeout(rt); rt = setTimeout(route, 0); };
window.addEventListener('hashchange', go);
sb.auth.onAuthStateChange((ev, s) => { if ((s?.user?.id || null) !== uid) go(); });
go();

/* ---------- sign in ---------- */
// A laptop showing the QR code and a live count: what the lecturer will project.
const ART_LAPTOP = `<svg class="art" viewBox="0 0 260 190" aria-hidden="true">

  <rect x="46" y="20" width="168" height="108" rx="6" fill="#0B2328"/>
  <rect x="22" y="140" width="216" height="11" rx="5.5" fill="#EDF2F1"/><rect x="108" y="140" width="44" height="4" rx="2" fill="#C5D3D1"/>
  <rect x="56" y="30" width="72" height="72" rx="6" fill="#fff"/>
  <g fill="none" stroke="#12343B" stroke-width="3"><rect x="62" y="36" width="18" height="18" rx="2"/><rect x="104" y="36" width="18" height="18" rx="2"/><rect x="62" y="78" width="18" height="18" rx="2"/></g>
  <g fill="#12343B"><rect x="67" y="41" width="8" height="8"/><rect x="109" y="41" width="8" height="8"/><rect x="67" y="83" width="8" height="8"/>
    <rect x="88" y="38" width="6" height="6"/><rect x="88" y="50" width="6" height="6"/><rect x="96" y="62" width="6" height="6"/>
    <rect x="108" y="66" width="6" height="6"/><rect x="88" y="76" width="6" height="6"/><rect x="100" y="84" width="6" height="6"/>
    <rect x="112" y="82" width="6" height="6"/><rect x="86" y="90" width="6" height="6"/></g>
  <text x="142" y="64" font-family="'Bricolage Grotesque',system-ui,sans-serif" font-weight="800" font-size="32" fill="#fff">126</text>
  <text x="143" y="80" font-family="system-ui,sans-serif" font-size="11" fill="#fff" opacity=".75">checked in</text>
  <rect x="143" y="92" width="58" height="7" rx="3.5" fill="#fff" opacity=".2"/><rect x="143" y="92" width="48" height="7" rx="3.5" fill="#3DBE86"/>
  <circle cx="222" cy="22" r="17" fill="#1C7C54" stroke="#12343B" stroke-width="5"/>
  <path d="M214 22l6 6 11-12" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;
function authScreen(title, sub, form) {
  app.innerHTML = `<div class="auth"><div class="auth-hero">
    <p class="lead">Attendance, clearly recorded.</p>
    <p class="sub">A straightforward tool for lecturers to manage class sessions and review attendance records.</p></div>
    <div class="auth-form"><div class="auth-card"><h1>${title}</h1><p class="muted">${sub}</p>${form}</div></div></div>`;
}
function viewLogin() {
  authScreen('Sign in', 'Enter your email. We’ll send you a code to sign in.',
    `<form id="f1" class="stack"><label>Email<input id="em" type="email" required autocomplete="email"></label>
    <button class="btn">Send code</button></form>`);
  $('#f1').onsubmit = async e => {
    e.preventDefault();
    const email = $('#em').value.trim().toLowerCase(), b = $('#f1 button');
    b.disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email });
    b.disabled = false;
    if (error) return toast('Could not send the code: ' + error.message, true);
    askCode(email);
  };
}
function askCode(email) {
  authScreen('Enter your code', `We sent a code to <b>${esc(email)}</b>. It can take a minute to arrive.`,
    `<form id="f2" class="stack"><label>Code<input id="cd" class="code" inputmode="numeric" autocomplete="one-time-code" required></label>
    <button class="btn" id="go">Sign in</button><button type="button" id="back" class="link">Use a different email</button></form>`);

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const d = first.split(';').length > first.split(',').length ? ';' : ',';   // French Excel uses ;
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const norm = h => String(h).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\s-]+/g, '_');
const ALIASES = {
  surname: ['surname', 'nom', 'last_name', 'family_name'],
  first_name: ['first_name', 'prenom', 'firstname'],
  second_name: ['second_name', 'middle_name'],
  student_number: ['student_number', 'number', 'matricule', 'student_id'],
  email: ['email', 'e_mail', 'mail', 'email_address'],
  section: ['section'],
  group_name: ['group', 'groupe', 'group_name']
};
function toEnrollments(rows, courseId) {
  const head = rows[0].map(norm), idx = {};
  for (const k in ALIASES) idx[k] = head.findIndex(h => ALIASES[k].includes(h));
  const missing = ['surname', 'first_name', 'email'].filter(k => idx[k] < 0);
  if (missing.length) return { error: 'Missing column(s): ' + missing.join(', ') + '. Check the first row of your file.' };
  const map = new Map(); let skipped = 0;
  for (const r of rows.slice(1)) {
    const v = k => (idx[k] >= 0 ? String(r[idx[k]] ?? '').trim() : '') || null;
    const email = (v('email') || '').toLowerCase();
    if (!v('surname') || !v('first_name') || !/^\S+@\S+\.\S+$/.test(email)) { skipped++; continue; }
    map.set(email, { course_id: courseId, student_email: email, surname: v('surname'), first_name: v('first_name'),
      second_name: v('second_name'), student_number: v('student_number'), section: v('section'), group_name: v('group_name') });
  }
  return { items: [...map.values()], skipped };
}
async function readTable(f) {
  if (/\.(xlsx|xls)$/i.test(f.name)) {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
    return rows.filter(r => r.some(x => String(x).trim() !== ''));
  }
  return parseCSV(await f.text());
}
function download(name, text, type = 'text/csv;charset=utf-8') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- course ---------- */
async function viewCourse(id, my) {
  app.innerHTML = LOADING;
  const [c, e, s] = await Promise.all([
    sb.from('courses').select('id,code,name').eq('id', id).single(),
    sb.from('enrollments').select('section,group_name', { count: 'exact' }).eq('course_id', id).range(0, 4999),
    sb.from('sessions').select('id,title,kind,section,group_name,started_at,closed_at').eq('course_id', id).order('started_at', { ascending: false }).limit(30)
  ]);
  if (my !== routeId) return;
  if (c.error || !c.data) { app.innerHTML = '<div class="wrap gap"><p>Course not found. <a href="#/">Back to your courses</a></p></div>'; return; }
  const total = e.count || 0;
  const uniq = k => [...new Set((e.data || []).map(r => r[k]).filter(Boolean))].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  const sections = uniq('section'), groups = uniq('group_name');
  const opts = (arr, all) => `<option value="">${all}</option>` + arr.map(x => `<option>${esc(x)}</option>`).join('');
  const sess = s.data || [];
  const wide = matchMedia('(min-width:861px)').matches;
  const chips = `<div class="chips"><span>${total} ${total === 1 ? 'student' : 'students'}</span>${groups.length ? `<span>${groups.length} ${groups.length === 1 ? 'group' : 'groups'}</span>` : ''}<span>${sess.length} ${sess.length === 1 ? 'session' : 'sessions'}</span></div>`;

  app.innerHTML = `${banner(c.data.name, c.data.code ? esc(c.data.code) : '', { back: { href: '#/', text: 'Your courses' }, extra: chips })}
    <div class="wrap pull pad"><div class="cols"><div>

    <section class="panel primary"><h2>Start attendance</h2>
      <form id="start" class="stack">
        <div class="row"><label>Title<input id="ttl" placeholder="e.g. Lecture 12"></label>
        <label>Type<select id="kind"><option value="lecture">Lecture</option><option value="td">TD</option><option value="tp">TP</option></select></label></div>
        <div class="row" id="grp" hidden><label>Section<select id="sec">${opts(sections, 'All sections')}</select></label>
        <label>Group<select id="gro">${opts(groups, 'All groups')}</select></label></div>
        <button class="btn" ${total ? '' : 'disabled'}>Start attendance</button>
        ${total ? '' : '<p class="note">Upload your class list first.</p>'}
      </form></section>

    <section class="panel"><h2>Past sessions</h2>${sess.length ? `<div class="list">${sess.map((x, i) => `
      <a class="item${i >= 5 ? ' more' : ''}" ${i >= 5 ? 'hidden' : ''} href="#/session/${x.id}"><span><b>${esc(x.title || KIND[x.kind])}</b><span class="muted">${esc(sessionMeta(x))}</span></span>
      <span class="badge ${x.closed_at ? 'idle' : 'ok'}">${x.closed_at ? 'Closed' : 'Open'}</span></a>`).join('')}</div>${sess.length > 5 ? `<button class="btn ghost small" id="moreBtn" type="button" style="margin-top:10px">Show ${sess.length - 5} older</button>` : ''}`
      : '<div class="empty">No sessions yet. Start one above when your class begins.</div>'}</section>

    </div><div>

    <details class="panel" ${total === 0 || wide ? 'open' : ''}><summary><h2>Class list</h2><span class="muted">${total ? `${total} students` : 'No students yet'}</span></summary>
      <div class="row"><label>Upload your class list (Excel or CSV)<input id="csv" type="file" accept=".xlsx,.xls,.csv,text/csv"></label>
      <button class="btn ghost" id="tpl" type="button">Download template</button></div>
      <p class="note">Columns: surname, first_name, second_name, student_number, email, section, group. Uploading again updates existing students.</p>
      <label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px"><input id="rep" type="checkbox" style="width:auto;min-height:0"> Replace the whole list instead of updating it</label></details>

    </div></div></div>`;

  const mb = $('#moreBtn');
  if (mb) mb.onclick = () => {
    const hide = !$('.item.more').hidden;
    document.querySelectorAll('.item.more').forEach(el => { el.hidden = hide; });
    mb.textContent = hide ? `Show ${sess.length - 5} older` : 'Show fewer';
  };
  $('#kind').onchange = () => { $('#grp').hidden = $('#kind').value === 'lecture'; };
  $('#tpl').onclick = () => download('class_list_template.csv',
    '\uFEFFsurname,first_name,second_name,student_number,email,section,group\r\nBenali,Amine,Yacine,2026001,amine.benali@example.edu,A,1\r\n');
  $('#start').onsubmit = async ev => {
    ev.preventDefault();
    const kind = $('#kind').value, b = $('#start button'); b.disabled = true;
    const { data, error } = await sb.from('sessions').insert({
      course_id: id, title: $('#ttl').value.trim() || KIND[kind], kind,
      section: kind === 'lecture' ? null : $('#sec').value || null,
      group_name: kind === 'lecture' ? null : $('#gro').value || null
    }).select('id').single();
    if (error) { b.disabled = false; return toast('Could not start attendance: ' + error.message, true); }
    location.hash = '#/session/' + data.id;
  };
  $('#csv').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    if (/\.pdf$/i.test(f.name)) return toast('That is a PDF. Open it in Excel, save it as .xlsx or .csv, and upload that file.', true);
    let rows;
    try { rows = await readTable(f); } catch (_) { return toast('Could not read that file. Use an Excel (.xlsx) or CSV file.', true); }
    if (rows.length < 2) return toast('That file has no student rows.', true);
    const r = toEnrollments(rows, id);
    if (r.error) return toast(r.error, true);
    if ($('#rep').checked) {
      if (!confirm(`Replace the whole class list with these ${r.items.length} students?`)) return;
      const del = await sb.from('enrollments').delete().eq('course_id', id);
      if (del.error) return toast('Could not clear the old list: ' + del.error.message, true);
    }
    for (let i = 0; i < r.items.length; i += 200) {
      const { error } = await sb.from('enrollments').upsert(r.items.slice(i, i + 200), { onConflict: 'course_id,student_email' });
      if (error) return toast('Upload failed: ' + error.message, true);
    }
    toast(`Imported ${r.items.length} students.` + (r.skipped ? ` Skipped ${r.skipped} rows with a missing name or invalid email.` : ''));
    go();
  };
}

/* ---------- session ---------- */
function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 3; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="${-m} ${-m} ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="Attendance QR code">
    <rect x="${-m}" y="${-m}" width="${n + 2 * m}" height="${n + 2 * m}" fill="#fff"/><path d="${d}" fill="#12343B"/></svg>`;
}
const cell = v => { v = String(v ?? ''); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };

async function viewSession(id, my) {
  app.innerHTML = LOADING;
  const { data: s, error } = await sb.from('sessions')
    .select('id,title,kind,section,group_name,started_at,closed_at,course_id,courses(name,code)').eq('id', id).single();
  if (my !== routeId) return;
  if (error || !s) { app.innerHTML = '<div class="wrap gap"><p>Session not found. <a href="#/">Back to your courses</a></p></div>'; return; }
  const open = !s.closed_at;
  const status = `<div class="chips"><span class="${open ? 'live' : 'done'}">${open ? 'Open for check-in' : 'Closed'}</span></div>`;

  app.innerHTML = `${banner(s.title || KIND[s.kind], esc(sessionMeta(s)), { back: { href: '#/course/' + s.course_id, text: s.courses?.name || 'Course' }, slim: true, extra: status })}
    <div class="wrap gap pad">
    ${open ? '' : `<div class="closedstrip">Attendance closed at ${fmtTime(s.closed_at)}. You can still mark students present below.</div>`}
    <section class="stage" id="stage" ${open ? '' : 'hidden'}>
      <div class="stage-info"><div class="count"><p class="big" id="big">0</p><p class="bigl" id="bigl">checked in</p></div><div class="pbar"><i id="pfill"></i></div>
        <label class="rot">QR code refresh <select id="rot">${[[15000, '15 seconds'], [30000, '30 seconds'], [60000, '1 minute'], [120000, '2 minutes'], [300000, '5 minutes']].map(([v, t]) => `<option value="${v}" ${v === rotateMs ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <div class="actions"><button class="btn ghost" id="fs">Show full screen</button><button class="btn danger" id="close">Close attendance</button></div>
        <p class="note tip">Students scan this code with their phone camera. It refreshes every <span id="rotTxt">${lbl(rotateMs)}</span>. A rotating code can reduce reuse of screenshots, but does not by itself prove who is physically present.</p></div>
      <div class="qrcol"><div class="qr" id="qr"></div><div class="bar"><i id="fill"></i></div><p class="muted" id="cd" style="text-align:center">Preparing code…</p></div>
    </section>
    <section class="panel"><h2>Attendance list</h2>
      <div id="sum"></div>
      <div class="tools"><input id="q" type="search" placeholder="Search by name or number" aria-label="Search students">
        <select id="flt" aria-label="Filter by status"><option value="all">Everyone</option><option value="present">Present</option><option value="absent">Absent</option></select>
        <select id="exportFormat" class="export-format" aria-label="Export format"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV (.csv)</option></select><button class="btn ghost" id="exportBtn">Export</button></div>
      <div class="shead"><span>Student</span><span>Group</span><span>Status</span><span></span></div><div id="rows"></div>
    </section></div>`;

  /* roster */
  let roster = [], filter = 'all', query = '';
  const paint = () => {
    const total = roster.length, present = roster.filter(r => r.status !== 'absent').length;
    const pct = total ? present / total * 100 : 0;
    $('#sum').innerHTML = `<div class="seg" role="img" aria-label="${present} of ${total} present"><i style="width:${pct}%"></i></div>
      <div class="sumrow"><span class="badge ok">${present} present</span><span class="badge bad">${total - present} absent</span><span class="muted">${total} expected</span></div>`;
    if (open) { $('#big').textContent = present; $('#bigl').textContent = `checked in of ${total}`; const pf = $('#pfill'); if (pf) pf.style.width = pct + '%'; }
    const q = query.toLowerCase();
    const list = roster.filter(r => (filter === 'all' || (filter === 'absent') === (r.status === 'absent'))
      && (!q || `${r.surname} ${r.first_name} ${r.second_name || ''} ${r.student_number || ''}`.toLowerCase().includes(q)));
    $('#rows').innerHTML = list.length ? list.map(r => {
      const here = r.status !== 'absent';
      return `<div class="srow"><div class="person"><span class="av ${here ? 'here' : ''}">${esc(initials(r))}</span><span><b>${esc(r.surname)}</b> ${esc(r.first_name)} ${esc(r.second_name || '')}${r.student_number ? `<small>${esc(r.student_number)}</small>` : ''}</span></div>
        <div class="grp">${esc([r.section, r.group_name].filter(Boolean).join(' / '))}</div>
        <div class="stat"><span class="badge ${here ? 'ok' : 'bad'}">${here ? 'Present' : 'Absent'}</span>${here ? `<small>${fmtTime(r.checked_at)}${r.method === 'manual' ? ', marked by lecturer' : ''}</small>` : ''}</div>
        <div class="act">${here ? '' : `<button class="btn small ghost" data-mark="${esc(r.student_email)}">Mark present</button>`}</div></div>`;
    }).join('') : '<p class="muted" style="padding:12px 8px">No students match.</p>';
  };
  const loadRoster = async () => {
    const { data, error } = await sb.rpc('session_roster', { p_session: id });
    if (my !== routeId || error) return;
    roster = data || []; paint();
  };
  $('#q').oninput = e => { query = e.target.value; paint(); };
  $('#flt').onchange = e => { filter = e.target.value; paint(); };
  $('#rows').onclick = async e => {
    const em = e.target.dataset.mark; if (!em) return;
    e.target.disabled = true;
    const { error } = await sb.rpc('mark_present', { p_session: id, p_email: em });
    if (error) { e.target.disabled = false; return toast('Could not mark present: ' + error.message, true); }
    loadRoster();
  };
  const sheet = () => {
    const head = ['Surname', 'First name', 'Second name', 'Student number', 'Section', 'Group', 'Status', 'Time', 'Method'];
    const rows = roster.map(r => [r.surname, r.first_name, r.second_name || '', r.student_number || '', r.section || '', r.group_name || '',
      r.status === 'absent' ? 'Absent' : 'Present', r.checked_at ? fmtTime(r.checked_at) : '',
      r.method === 'manual' ? 'Marked by lecturer' : r.method === 'qr' ? 'QR' : '']);
    return [head, ...rows];
  };
  const base = () => `${s.courses?.name || 'course'}_${s.title || s.kind}_${s.started_at.slice(0, 10)}`.replace(/[^\w.-]+/g, '_');
  $('#exportBtn').onclick = () => {
    if ($('#exportFormat').value === 'csv') {
      download(base() + '.csv', '\uFEFF' + sheet().map(r => r.map(cell).join(';')).join('\r\n'));
      toast('CSV export prepared.');
      return;
    }
    const ws = XLSX.utils.aoa_to_sheet(sheet());
    ws['!cols'] = [18, 16, 16, 18, 9, 8, 10, 8, 18].map(w => ({ wch: w }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
    XLSX.writeFile(wb, base() + '.xlsx');
    toast('Excel export prepared.');
  };
  await loadRoster();
  if (!open) return;
  every(loadRoster, POLL_MS);

  /* rotating QR */
  let lastRot = 0, lastTry = 0, rotating = false;
  const rotate = async () => {
    rotating = true;
    const { data, error } = await sb.rpc('new_token', { p_session: id, p_seconds: Math.round(rotateMs / 1000) + 10 });
    rotating = false;
    if (my !== routeId) return;
    if (error) { $('#cd').textContent = 'Connection problem. Retrying…'; return; }
    const url = new URL(STUDENT_PAGE, location.href); url.searchParams.set('t', data);
    $('#qr').innerHTML = qrSvg(url.href);
    lastRot = Date.now();
  };
  every(() => {
    const now = Date.now();
    if (!rotating && now - lastRot >= rotateMs && now - lastTry >= 3000) { lastTry = now; rotate(); }
  }, 500);
  let lastSec = -1;
  const frame = () => {
    const rem = lastRot ? Math.max(0, rotateMs - (Date.now() - lastRot)) : rotateMs;
    $('#fill').style.width = (rem / rotateMs * 100) + '%';
    const sec = Math.ceil(rem / 1000);
    if (lastRot && sec !== lastSec) { lastSec = sec; $('#cd').textContent = 'New code in ' + (sec >= 60 ? Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') : sec + 's'); }
    raf = requestAnimationFrame(frame);
  };
  frame();

  /* controls */
  $('#rot').onchange = e => {
    rotateMs = +e.target.value;
    try { localStorage.setItem('rotateMs', rotateMs); } catch (_) {}
    $('#rotTxt').textContent = lbl(rotateMs);
    lastRot = 0; lastTry = 0; lastSec = -1;   // issue a new code now, with the new duration
  };
  $('#fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('#stage').requestFullscreen().catch(() => toast('Full screen is not available in this browser.', true));
  $('#close').onclick = async () => {
    if (!confirm('Close attendance? Students will no longer be able to check in.')) return;
    const { error } = await sb.rpc('close_session', { p_session: id });
    if (error) return toast('Could not close: ' + error.message, true);
    go();
  };
  /* keep the lecturer's screen awake while the code is showing */
  const lock = async () => { try { wake = await navigator.wakeLock?.request('screen'); } catch (_) {} };
  lock();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && routeId === my) lock(); });
}
